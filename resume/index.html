<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ethan Xu · Résumé</title>
  <meta name="description" content="Résumé of Ethan Xu, Computer Science at UC Berkeley.">
  <meta name="theme-color" content="#1c2a25">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .resume-bar { position: sticky; top: 0; z-index: 5; padding-top: calc(.75rem + env(safe-area-inset-top, 0px)); }
    .resume-pages { flex: 1; overflow: visible; }
  </style>
  <script src="../site-config.js"></script>
</head>
<body>
  <div class="resume-bar">
    <a class="btn btn-ghost btn-sm" href="../">← ethanxu.dev</a>
    <h2>Ethan Xu · Résumé</h2>
    <div class="resume-actions">
      <a class="btn btn-gold btn-sm" id="download" href="../assets/resume.pdf" download="Ethan_Xu_Resume.pdf">Download ↓</a>
    </div>
  </div>
  <main class="resume-pages" id="pages">
    <noscript><p><a href="../assets/resume.pdf">Open the résumé PDF</a></p></noscript>
  </main>

  <script src="../resume-viewer.js"></script>
  <script>
    const SITE = window.SITE || {};
    const file = new URL(SITE.resumeFile || 'assets/resume.pdf', new URL('../', location.href)).href;
    const dl = document.getElementById('download');
    dl.href = file;
    if (SITE.resumeDownloadName) dl.download = SITE.resumeDownloadName;
    window.ResumeViewer.render(document.getElementById('pages'), file);
  </script>
</body>
</html>
