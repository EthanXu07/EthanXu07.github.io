<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ethan Xu · by the fire</title>
  <meta name="description" content="Ethan Xu: Computer Science at UC Berkeley.">
  <!-- The secret card: reached from the campfire past the castle in the title-screen level. Not linked in the nav. -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07060c">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400;1,9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="/site-config.js"></script>
  <style>
    :root { color-scheme: dark; --ember: #3a1105; --ember-2: #6b2308; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07060c; overflow: hidden; }
    body { font: 400 1rem/1.5 "IBM Plex Mono", ui-monospace, monospace; color: #f5e6cf; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* Film grain + vignette so it reads like a photo, not a game */
    .grain, .vignette { position: fixed; inset: 0; pointer-events: none; }
    .vignette { background: radial-gradient(120% 90% at 50% 62%, transparent 45%, rgba(3, 2, 6, .75) 100%); }
    .grain {
      opacity: .13; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grain .6s steps(3) infinite;
    }
    @keyframes grain { 0% { transform: translate(0, 0); } 33% { transform: translate(-6px, 4px); } 66% { transform: translate(5px, -5px); } }

    /* The card lives in the heart of the fire (positioned by script) */
    .card {
      position: fixed; left: var(--fx, 50%); top: var(--fy, 45%);
      width: min(84vw, 23rem); transform: translate(-50%, -50%);
      text-align: center; color: var(--ember);
      animation: flicker 3.2s infinite, arrive 1.6s ease-out both;
    }
    .card h1 {
      margin: 0; font: italic 600 clamp(2.4rem, 8.5vw, 3.5rem)/1 "Fraunces", Georgia, serif;
      letter-spacing: -.01em; text-shadow: 0 0 18px rgba(255, 244, 214, .9);
    }
    .card .role { margin: .5rem 0 .2rem; font: italic 400 clamp(1rem, 3.6vw, 1.15rem)/1.35 "Fraunces", Georgia, serif; color: var(--ember-2); }
    .card .honor { margin: 0 0 1.05rem; font: 500 clamp(.72rem, 2.6vw, .8rem)/1.4 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ember-2); }
    .card .email, .card .links { margin: 0; font-size: clamp(.85rem, 3.2vw, .95rem); font-weight: 500; }
    .card .links { margin-top: .45rem; display: flex; justify-content: center; gap: .7rem; }
    .card .links span { opacity: .5; }
    .card a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(58, 17, 5, .35); padding-bottom: 1px; }
    .card a:hover, .card a:focus-visible { border-bottom-color: currentColor; outline: none; }
    .card a:focus-visible { background: rgba(255, 250, 235, .6); }
    @keyframes flicker { 0%, 100% { opacity: 1; } 45% { opacity: .93; } 52% { opacity: 1; } 70% { opacity: .96; } }
    @keyframes arrive { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: blur(0); } }

    .back {
      position: fixed; left: calc(1rem + env(safe-area-inset-left, 0px)); bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      font-size: .78rem; color: rgba(245, 230, 207, .55); text-decoration: none;
    }
    .back:hover, .back:focus-visible { color: #f5e6cf; }
    .back-short { display: none; }
    @media (max-width: 640px) { .back-long { display: none; } .back-short { display: inline; } }
    /* Arriving from the game: start dark, then the fire catches */
    .intro { position: fixed; inset: 0; background: #07060c; pointer-events: none; animation: introFade 1.8s .15s ease-out forwards; }
    @keyframes introFade { to { opacity: 0; visibility: hidden; } }
    .card { animation-delay: 0s, .9s; }
    @media (prefers-reduced-motion: reduce) { .card, .grain { animation: none; } .intro { display: none; } }
  </style>
</head>
<body>
  <canvas id="fire" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="intro" aria-hidden="true"></div>

  <main class="card" id="card">
    <h1>Ethan Xu</h1>
    <p class="role">Computer Science · UC Berkeley</p>
    <p class="honor">Regents’ &amp; Chancellor’s Scholar</p>
    <p class="email"><a id="cEmail" href="mailto:ethan_xu@berkeley.edu">ethan_xu@berkeley.edu</a></p>
    <p class="links">
      <a id="cPhone" href="tel:+14098673067">409-867-3067</a>
      <span aria-hidden="true">·</span>
      <a href="https://ethanxu.dev">ethanxu.dev</a>
    </p>
  </main>

  <a class="back" href="/">← <span class="back-long">back to the level</span><span class="back-short">back</span></a>

  <script>
  (() => {
    // ---------- Links from site-config.js (same source as the main site) ----------
    const SITE = window.SITE || {};
    if (SITE.email) { const a = document.getElementById('cEmail'); a.href = `mailto:${SITE.email}`; a.textContent = SITE.email; }
    if (SITE.phone) { const a = document.getElementById('cPhone'); a.href = `tel:+1${SITE.phone.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '')}`; a.textContent = SITE.phone; }

    // ---------- Scene ----------
    const canvas = document.getElementById('fire');
    const ctx = canvas.getContext('2d');
    const card = document.getElementById('card');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W, H, dpr, S, fx, fy, baseW, flameH, horizon, stars = [], treeLayers = [], tongues = [], rocks = [], coals = [], moon;
    let look = 0, lookTarget = 0, t = 0;
    const rand = (a, b) => a + Math.random() * (b - a);
    const seeded = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

    // Soft round sprites, pre-rendered once per colour (fast to draw hundreds of times)
    function sprite(r, g, b) {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const x = c.getContext('2d');
      const grd = x.createRadialGradient(32, 32, 0, 32, 32, 32);
      grd.addColorStop(0, `rgba(${r},${g},${b},1)`);
      grd.addColorStop(0.4, `rgba(${r},${g},${b},.55)`);
      grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
      x.fillStyle = grd; x.fillRect(0, 0, 64, 64);
      return c;
    }
    const FLAME = [sprite(255, 248, 225), sprite(255, 205, 90), sprite(255, 128, 36), sprite(196, 48, 20), sprite(90, 20, 14)];
    const EMBER = sprite(255, 170, 70);

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      S = Math.min(W / 1200, H / 800) * 1.1;        // scene scale
      S = Math.max(S, Math.min(W, H) / 700);
      horizon = H * 0.44;
      fx = W / 2; fy = H * 0.7;                       // base of the fire
      baseW = W < 640 ? W * 0.72 : Math.min(W * 0.52, 300 * S + 120);
      flameH = Math.min(H * 0.56, baseW * (W < 640 ? 1.45 : 1.25));
      tongues = Array.from({ length: 9 }, (_, i) => {
        const u = i / 8 - 0.5;
        return { u, h: flameH * (1 - Math.abs(u) * 1.25) * (0.78 + seeded(i + 21) * 0.3), w: baseW * 0.17 * (1 - Math.abs(u) * 0.45), ph: seeded(i + 40) * 6.28 };
      }).sort((a, b) => a.h - b.h);
      stars = Array.from({ length: Math.round(W * horizon / 2600) }, (_, i) => ({ x: seeded(i + 1) * W, y: seeded(i + 99) * horizon * 0.95, r: seeded(i + 7) * 1.1 + 0.3, p: seeded(i + 3) * 6.28 }));
      // Two rows of pines: a hazy far row and a dark near row
      treeLayers = [
        { color: '#0b0c18', par: 0.25, list: pines(22 * S + 12, 45, 60, 101) },
        { color: '#040409', par: 0.45, list: pines(34 * S + 16, 70, 90, 202) },
      ];
      moon = { x: W * (W < 640 ? 0.86 : 0.91), y: horizon * 0.26, r: 22 * S + 10 };
      // Fire-ring rocks: lumpy polygons, sized and placed once
      const rn = W < 640 ? 11 : 14;
      rocks = Array.from({ length: rn }, (_, i) => {
        const a = (i / rn) * 6.283 + 0.12 + (seeded(i + 60) - 0.5) * 0.18;
        const w = (17 + seeded(i) * 12) * S, h = (11 + seeded(i + 4) * 7) * S;
        const verts = Array.from({ length: 10 }, (_, j) => {
          const th = (j / 10) * 6.283, r = 0.82 + seeded(i * 10 + j) * 0.3;
          return [Math.cos(th) * w * r, Math.sin(th) * h * r * (Math.sin(th) > 0 ? 0.55 : 1)];
        });
        return { a, w, h, verts, front: Math.sin(a) > 0.05 };
      });
      coals = Array.from({ length: 10 }, (_, i) => ({ u: (seeded(i + 300) - 0.5) * 0.7, v: seeded(i + 320), r: (2 + seeded(i + 340) * 3) * S, ph: seeded(i + 360) * 6.28 }));
      // Put the card in the white-hot core of the fire
      card.style.setProperty('--fx', `${fx}px`);
      card.style.setProperty('--fy', `${fy - flameH * 0.4}px`);
    }

    function pines(step, hMin, hVar, seed) {
      const list = [];
      for (let x = -80, i = 0; x < W + 120; x += step * (0.7 + seeded(seed + i) * 0.6), i++) {
        list.push({ x, h: (hMin + seeded(seed + i * 3) * hVar) * S + 20, tiers: 4 + Math.floor(seeded(seed + i * 7) * 3), lean: (seeded(seed + i * 5) - 0.5) * 0.06 });
      }
      return list;
    }

    // ---------- Background ----------
    function sky(off) {
      const g = ctx.createLinearGradient(0, 0, 0, horizon);
      g.addColorStop(0, '#05050d'); g.addColorStop(0.6, '#0f0c1d'); g.addColorStop(1, '#231526');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon + 2);
      for (const s of stars) {
        const a = reduceMotion ? 0.8 : 0.45 + 0.45 * Math.sin(t * 0.02 + s.p);
        ctx.fillStyle = `rgba(245,235,215,${a})`;
        ctx.beginPath(); ctx.arc(s.x + off * 0.2, s.y, s.r, 0, 6.283); ctx.fill();
      }
      shootingStar(off);
      drawMoon(off * 0.15);
      for (const layer of treeLayers) drawPines(layer, off * layer.par);
    }

    // Every so often a shooting star streaks across the upper sky (behind the trees)
    let meteor = null, nextMeteor = location.search.includes('meteor') ? 20 : 240 + Math.random() * 360;
    function shootingStar(off) {
      if (reduceMotion) return;
      if (!meteor && t > nextMeteor) {
        const dir = Math.random() < 0.5 ? -1 : 1;
        meteor = { x: W * (0.15 + Math.random() * 0.7), y: horizon * (0.05 + Math.random() * 0.3), vx: dir * (7 + Math.random() * 5) * Math.max(1, S), vy: (2.2 + Math.random() * 1.8) * Math.max(1, S), life: 0, max: 42 + Math.random() * 20 };
        nextMeteor = t + 300 + Math.random() * 600; // ~5–15 s at 60 fps
      }
      if (!meteor) return;
      const m = meteor;
      m.x += m.vx; m.y += m.vy; m.life++;
      const k = m.life / m.max, alpha = Math.sin(Math.PI * Math.min(1, k)); // fade in, then out
      const len = 14, tx = m.x - m.vx * len, ty = m.y - m.vy * len;
      const g = ctx.createLinearGradient(m.x + off * 0.2, m.y, tx + off * 0.2, ty);
      g.addColorStop(0, `rgba(255,250,235,${0.95 * alpha})`); g.addColorStop(1, 'rgba(255,250,235,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6 * Math.max(1, S * 0.8); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x + off * 0.2, m.y); ctx.lineTo(tx + off * 0.2, ty); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,245,${alpha})`; ctx.beginPath(); ctx.arc(m.x + off * 0.2, m.y, 1.6 * Math.max(1, S * 0.8), 0, 6.283); ctx.fill();
      if (m.life >= m.max || m.y > horizon) meteor = null;
    }

    function drawMoon(off) {
      const { r } = moon, x = moon.x + off, y = moon.y;
      const halo = ctx.createRadialGradient(x, y, r * 0.8, x, y, r * 5);
      halo.addColorStop(0, 'rgba(226,220,200,0.18)'); halo.addColorStop(1, 'rgba(226,220,200,0)');
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, r * 5, 0, 6.283); ctx.fill();
      const disc = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
      disc.addColorStop(0, '#f7f1dd'); disc.addColorStop(1, '#d9cfb4');
      ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      // craters / maria
      ctx.fillStyle = 'rgba(160,150,125,0.35)';
      for (const [cx, cy, cr] of [[-0.3, -0.15, 0.22], [0.25, 0.2, 0.16], [0.1, -0.4, 0.1], [-0.1, 0.35, 0.12], [0.42, -0.1, 0.08]]) {
        ctx.beginPath(); ctx.arc(x + cx * r, y + cy * r, cr * r, 0, 6.283); ctx.fill();
      }
    }

    function drawPines(layer, off) {
      const base = horizon + 6;
      const g = ctx.createLinearGradient(0, horizon - 160 * S, 0, base);
      g.addColorStop(0, layer.color); g.addColorStop(1, layer === treeLayers[1] ? '#0d080b' : '#10101c');
      ctx.fillStyle = g;
      ctx.beginPath();
      for (const tr of layer.list) {
        const x = tr.x + off, top = base - tr.h, w = tr.h * 0.3;
        ctx.rect(x - tr.h * 0.02, base - tr.h * 0.18, tr.h * 0.04, tr.h * 0.18); // trunk
        for (let k = 0; k < tr.tiers; k++) {
          const t0 = top + (k * tr.h * 0.72) / tr.tiers;
          const t1 = top + ((k + 1) * tr.h * 0.72) / tr.tiers + tr.h * 0.12;
          const hw = w * (0.3 + (0.7 * (k + 1)) / tr.tiers);
          const ax = x + tr.lean * (tr.h - (t0 - top));
          // tier with a ragged, drooping bottom edge
          ctx.moveTo(ax, t0);
          ctx.lineTo(x + hw, t1);
          ctx.lineTo(x + hw * 0.62, t1 - tr.h * 0.035);
          ctx.lineTo(x + hw * 0.34, t1 + tr.h * 0.01);
          ctx.lineTo(x, t1 - tr.h * 0.03);
          ctx.lineTo(x - hw * 0.34, t1 + tr.h * 0.01);
          ctx.lineTo(x - hw * 0.62, t1 - tr.h * 0.035);
          ctx.lineTo(x - hw, t1);
          ctx.closePath();
        }
      }
      ctx.fill();
      // ground strip that hides trunk bottoms
      ctx.fillRect(-100, base - 2, W + 200, 30);
    }

    function ground(glow) {
      const g = ctx.createLinearGradient(0, horizon, 0, H);
      g.addColorStop(0, '#0b080c'); g.addColorStop(1, '#140d0d');
      ctx.fillStyle = g; ctx.fillRect(0, horizon + 2, W, H - horizon);
      // Pool of firelight on the ground
      ctx.save();
      ctx.translate(fx, fy); ctx.scale(1, 0.38);
      const r = baseW * 2.6;
      const pool = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      pool.addColorStop(0, `rgba(255,150,70,${0.42 * glow})`);
      pool.addColorStop(0.45, `rgba(190,80,40,${0.16 * glow})`);
      pool.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = pool; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
      ctx.restore();
    }

    // ---------- Friends: seated around the fire, each with their own look ----------
    // Everything is drawn in the person's local units (scaled by s around their seat),
    // then tinted by a warm gradient centred on the fire so the side facing it glows.
    const OUTLINE = 'rgba(12,7,9,0.85)';
    function person(x, y, s, o) {
      ctx.save();
      ctx.translate(x, y); ctx.scale(s, s); ctx.translate(-x, -y);
      const lfx = x + (fx - x) / s, lfy = y + (fy - flameH * 0.25 - y) / s;
      const R = Math.hypot(lfx - x, lfy - (y - 50)) * 1.5;
      const light = ctx.createRadialGradient(lfx, lfy, 0, lfx, lfy, R);
      light.addColorStop(0, 'rgba(255,170,100,0.5)'); light.addColorStop(0.55, 'rgba(255,120,60,0.18)');
      light.addColorStop(0.8, 'rgba(10,5,10,0.3)'); light.addColorStop(1, 'rgba(10,5,10,0.6)');
      const part = (build, color, outline = true) => {
        ctx.beginPath(); build();
        ctx.fillStyle = color; ctx.fill();
        ctx.fillStyle = light; ctx.fill();
        if (outline) { ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2.2; ctx.stroke(); }
      };
      const limb = (pts, color, w = 9) => {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        const path = () => { ctx.beginPath(); pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py))); };
        path(); ctx.strokeStyle = OUTLINE; ctx.lineWidth = w + 3; ctx.stroke();
        path(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
        path(); ctx.strokeStyle = light; ctx.lineWidth = w; ctx.stroke();
      };

      // seat log
      part(() => ctx.roundRect(x - 44, y + 8, 88, 16, 8), '#2a1a12');
      // legs (knees toward the fire) + shoes
      for (const sd of [-1, 1]) {
        part(() => ctx.roundRect(x + sd * 11 - 8, y - 8, 16, 32, 7), o.pants);
        part(() => ctx.ellipse(x + sd * 12, y + 26, 10, 5.5, 0, 0, 6.283), o.shoes);
      }
      // hood behind the head
      if (o.hood) part(() => ctx.ellipse(x, y - 66, 19, 14, 0, 0, 6.283), o.top);
      // torso (hoodie / jacket)
      part(() => {
        ctx.moveTo(x - 23, y - 58); ctx.quadraticCurveTo(x - 29, y - 22, x - 21, y + 2);
        ctx.lineTo(x + 21, y + 2); ctx.quadraticCurveTo(x + 29, y - 22, x + 23, y - 58);
        ctx.quadraticCurveTo(x, y - 66, x - 23, y - 58);
      }, o.top);
      if (o.hood) {                                   // drawstrings + pocket
        ctx.strokeStyle = 'rgba(255,190,130,0.22)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(x - 5, y - 56); ctx.lineTo(x - 6, y - 44); ctx.moveTo(x + 5, y - 56); ctx.lineTo(x + 6, y - 44); ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.moveTo(x - 13, y - 22); ctx.lineTo(x + 13, y - 22); ctx.stroke();
      }
      // head + face
      part(() => ctx.arc(x, y - 77, 13.5, 0, 6.283), o.skin);
      ctx.fillStyle = 'rgba(255,170,110,0.18)';                                          // firelight on the face
      ctx.beginPath(); ctx.ellipse(x, y - 75, 8, 7, 0, 0, 6.283); ctx.fill();
      // hair / hats
      if (o.hair === 'long') {
        part(() => { ctx.arc(x, y - 79, 15, Math.PI * 1.02, Math.PI * 1.98); ctx.lineTo(x + 16, y - 58); ctx.lineTo(x + 11, y - 58); ctx.lineTo(x + 11, y - 80); ctx.lineTo(x - 11, y - 80); ctx.lineTo(x - 11, y - 58); ctx.lineTo(x - 16, y - 58); ctx.closePath(); }, o.hairColor);
      } else if (o.hair === 'curly') {
        part(() => { for (const [cx, cy] of [[-10, -84], [-4, -90], [4, -90], [10, -84], [13, -77], [-13, -77]]) { ctx.moveTo(x + cx + 6, y + cy); ctx.arc(x + cx, y + cy, 6, 0, 6.283); } }, o.hairColor, false);
      }
      if (o.beanie) {
        part(() => { ctx.arc(x, y - 80, 14.5, Math.PI, 0); ctx.lineTo(x + 15, y - 78); ctx.lineTo(x - 15, y - 78); ctx.closePath(); }, o.beanie);
        part(() => ctx.arc(x, y - 96, 4.5, 0, 6.283), o.beanie);
        ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 14, y - 82); ctx.lineTo(x + 14, y - 82); ctx.stroke();
      }

      // arms + props
      if (o.guitar) {
        const gx = x - 4, gy = y - 20;
        ctx.save(); ctx.translate(gx, gy); ctx.rotate(-0.42);
        // neck + headstock
        part(() => ctx.rect(14, -4.5, 58, 9), '#5a3520');
        part(() => ctx.roundRect(70, -7, 14, 14, 3), '#3a2214');
        ctx.fillStyle = '#6b5440'; for (let k = 0; k < 3; k++) { ctx.fillRect(73 + k * 3.5, -9, 2, 2.5); ctx.fillRect(73 + k * 3.5, 6.5, 2, 2.5); }
        ctx.strokeStyle = 'rgba(230,200,160,0.25)'; ctx.lineWidth = 0.8;
        for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.moveTo(22 + k * 8, -4.5); ctx.lineTo(22 + k * 8, 4.5); ctx.stroke(); }           // frets
        // body: honey-coloured acoustic with a dark sound hole
        part(() => { ctx.ellipse(-12, 0, 17, 15, 0, 0, 6.283); ctx.moveTo(18, 0); ctx.ellipse(8, 0, 12, 11, 0, 0, 6.283); }, '#3d2618');
        ctx.fillStyle = '#0d0806'; ctx.beginPath(); ctx.arc(2, 0, 5, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#3a2214'; ctx.fillRect(-20, -4, 4, 8);                                                                       // bridge
        ctx.strokeStyle = 'rgba(255,210,160,0.4)'; ctx.lineWidth = 0.7;
        for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(-18, k * 1.6); ctx.lineTo(72, k * 1.4); ctx.stroke(); }             // strings
        ctx.restore();
        limb([[x - 21, y - 52], [x - 24, y - 30], [x - 10, y - 18]], o.top);              // strumming arm
        limb([[x + 21, y - 52], [x + 30, y - 40], [x + 40, y - 46]], o.top);              // fretting arm
        part(() => ctx.arc(x + 42, y - 47, 4, 0, 6.283), o.skin);
        part(() => ctx.arc(x - 9, y - 18, 4, 0, 6.283), o.skin);
      } else if (o.stick) {
        const d = o.dir;
        limb([[x + 20 * d, y - 52], [x + 30 * d, y - 34], [x + 34 * d, y - 26]], o.top);
        limb([[x - 20 * d, y - 52], [x - 6 * d, y - 32], [x + 26 * d, y - 25]], o.top);
        part(() => ctx.arc(x + 32 * d, y - 25, 4.5, 0, 6.283), o.skin);
        ctx.restore(); ctx.save();
        const hx = x + 32 * d * s, hy = y - 25 * s;
        roastingStick(hx, hy, o.stick.x, o.stick.y, Math.max(2, 3 * s), 8 * s, o.toast);
      } else {
        limb([[x - 21, y - 52], [x - 16, y - 28], [x - 8, y - 12]], o.top);
        limb([[x + 21, y - 52], [x + 16, y - 28], [x + 8, y - 12]], o.top);
        part(() => { ctx.arc(x - 7, y - 11, 4, 0, 6.283); ctx.moveTo(x + 11, y - 11); ctx.arc(x + 7, y - 11, 4, 0, 6.283); }, o.skin);
        if (o.mug) { part(() => ctx.roundRect(x - 6, y - 20, 12, 13, 2), o.mug); ctx.fillStyle = 'rgba(240,235,225,0.15)'; ctx.fillRect(x - 3, y - 27, 1.5, 5); ctx.fillRect(x + 1, y - 29, 1.5, 6); }
      }
      ctx.restore();
    }

    // A stick with a marshmallow on the end, outlined so it reads against the flames
    function roastingStick(hx, hy, tx, ty, w, r, toast) {
      ctx.lineCap = 'round';
      ctx.strokeStyle = OUTLINE; ctx.lineWidth = w + 2.5;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.strokeStyle = '#8a5a34'; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,205,140,0.7)'; ctx.lineWidth = Math.max(1, w * 0.35);
      ctx.beginPath(); ctx.moveTo(hx, hy - w * 0.3); ctx.lineTo(tx, ty - w * 0.3); ctx.stroke();
      const ang = Math.atan2(ty - hy, tx - hx);
      marshmallow(tx + Math.cos(ang) * r * 0.9, ty + Math.sin(ang) * r * 0.9, r, toast, ang);
    }

    function marshmallow(x, y, r, toast, ang = 0) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
      ctx.fillStyle = 'rgba(255,190,110,0.35)'; ctx.beginPath(); ctx.arc(0, 0, r * 2, 0, 6.283); ctx.fill();   // warm glow
      ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#3a2214'; ctx.lineWidth = Math.max(1.2, r * 0.16);
      ctx.beginPath(); ctx.roundRect(-r, -r * 0.85, r * 2, r * 1.7, r * 0.55); ctx.fill(); ctx.stroke();
      // toasted side facing the fire, getting browner over time
      const tc = toast > 0.6 ? 'rgba(150,80,30,0.9)' : toast > 0.3 ? 'rgba(210,140,60,0.8)' : 'rgba(235,190,120,0.6)';
      ctx.fillStyle = tc; ctx.beginPath(); ctx.roundRect(r * 0.1, -r * 0.85, r * 0.9, r * 1.7, [0, r * 0.55, r * 0.55, 0]); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.35, r * 0.3, r * 0.18, 0, 0, 6.283); ctx.fill(); // shine
      ctx.restore();
    }

    // ---------- Fire ring, logs, flames ----------
    function stones(front) {
      const rx = baseW * 0.64, ry = rx * 0.3;
      for (const rk of rocks) {
        if (rk.front !== front) continue;
        const x = fx + Math.cos(rk.a) * rx, y = fy + Math.sin(rk.a) * ry + 8 * S;
        ctx.save(); ctx.translate(x, y);
        // contact shadow
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath(); ctx.ellipse(0, rk.h * 0.45, rk.w * 1.05, rk.h * 0.35, 0, 0, 6.283); ctx.fill();
        // body: back-row rocks face the fire (lit), front-row rocks are lit only on their far edge
        const g = ctx.createLinearGradient(0, -rk.h, 0, rk.h * 0.6);
        if (front) { g.addColorStop(0, '#9a6244'); g.addColorStop(0.3, '#4a3229'); g.addColorStop(1, '#171012'); }
        else { g.addColorStop(0, '#b0714a'); g.addColorStop(0.5, '#5b3a2d'); g.addColorStop(1, '#1c1517'); }
        ctx.fillStyle = g;
        ctx.beginPath(); rk.verts.forEach(([vx, vy], j) => (j ? ctx.lineTo(vx, vy) : ctx.moveTo(vx, vy))); ctx.closePath(); ctx.fill();
        // a crack + speckle for texture
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = Math.max(1, S);
        ctx.beginPath(); ctx.moveTo(-rk.w * 0.25, -rk.h * 0.5); ctx.lineTo(-rk.w * 0.05, -rk.h * 0.1); ctx.lineTo(rk.w * 0.1, rk.h * 0.1); ctx.stroke();
        ctx.fillStyle = front ? 'rgba(255,170,110,0.2)' : 'rgba(255,200,150,0.25)';
        ctx.beginPath(); ctx.ellipse(rk.w * 0.2, -rk.h * 0.55, rk.w * 0.35, rk.h * 0.18, -0.2, 0, 6.283); ctx.fill();
        ctx.restore();
      }
    }

    function log(x0, y0, x1, y1, thick, bark) {
      ctx.lineCap = 'round';
      ctx.strokeStyle = bark; ctx.lineWidth = thick;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = thick * 0.25;       // bark sheen
      ctx.beginPath(); ctx.moveTo(x0, y0 - thick * 0.2); ctx.lineTo(x1, y1 - thick * 0.2); ctx.stroke();
    }

    // Logs lean in toward the middle like a teepee. Back logs are drawn before the
    // flames (mostly hidden), front logs after them (their lower ends show).
    const LOG_ANGLES_BACK = [192, 232, 300, 348], LOG_ANGLES_FRONT = [150, 38];
    function logEnds(deg) {
      const th = deg * Math.PI / 180, back = Math.sin(th) < 0, R = baseW * (back ? 0.56 : 0.58), ry = baseW * (back ? 0.13 : 0.17);
      return { ox: fx + Math.cos(th) * R, oy: fy + Math.sin(th) * ry + 4 * S, ax: fx + Math.cos(th) * baseW * 0.06, ay: fy - flameH * (back ? 0.2 : 0.12) };
    }
    function teepeeLog(deg, i, portion, front, glow) {
      const { ox, oy, ax, ay } = logEnds(deg);
      const ex = ox + (ax - ox) * portion, ey = oy + (ay - oy) * portion;
      const th = (17 + seeded(i + 70) * 7) * S;
      log(ox, oy, ex, ey, th, ['#3a2216', '#301b12', '#40261a', '#2a1810'][i % 4]);
      // charred, glowing section toward the fire
      const cg = ctx.createLinearGradient(ox, oy, ex, ey);
      cg.addColorStop(0, 'rgba(0,0,0,0)'); cg.addColorStop(0.55, 'rgba(20,8,6,0.65)'); cg.addColorStop(1, `rgba(255,110,40,${0.75 * glow})`);
      ctx.strokeStyle = cg; ctx.lineWidth = th * 0.8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
      if (front) {
        // end grain on the outer end
        const ang = Math.atan2(ey - oy, ex - ox);
        ctx.save(); ctx.translate(ox, oy); ctx.rotate(ang);
        ctx.fillStyle = '#7d5638'; ctx.beginPath(); ctx.ellipse(0, 0, th * 0.28, th * 0.5, 0, 0, 6.283); ctx.fill();
        ctx.strokeStyle = '#4e331f'; ctx.lineWidth = Math.max(1, S);
        ctx.beginPath(); ctx.ellipse(0, 0, th * 0.14, th * 0.26, 0, 0, 6.283); ctx.stroke();
        ctx.restore();
      }
    }

    function logs(glow = 1) {
      // charred ash bed inside the stone ring
      const ar = baseW * 0.6;
      ctx.save(); ctx.translate(fx, fy + 6 * S); ctx.scale(1, 0.3);
      const ash = ctx.createRadialGradient(0, 0, 0, 0, 0, ar);
      ash.addColorStop(0, '#2a120a'); ash.addColorStop(0.6, '#1a0d0a'); ash.addColorStop(1, 'rgba(20,12,10,0)');
      ctx.fillStyle = ash; ctx.beginPath(); ctx.arc(0, 0, ar, 0, 6.283); ctx.fill();
      ctx.restore();
      // ember glow under the wood
      const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, baseW * 0.45);
      g.addColorStop(0, `rgba(255,120,40,${0.95 * glow})`); g.addColorStop(0.5, 'rgba(200,50,20,0.5)'); g.addColorStop(1, 'rgba(120,20,10,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(fx, fy, baseW * 0.45, baseW * 0.13, 0, 0, 6.283); ctx.fill();
      // the log pile: all of it sits under the flames; only the ends show around the base
      LOG_ANGLES_BACK.forEach((d, i) => teepeeLog(d, i, 1, true, glow));
      LOG_ANGLES_FRONT.forEach((d, i) => teepeeLog(d, i + 5, 0.75, true, glow));
      const fr = baseW * 0.11;
      for (const c of coals) {
        const x = fx + c.u * baseW * 0.8, y = fy + fr * (0.45 + c.v * 0.35);
        const k = reduceMotion ? 1 : 0.7 + 0.3 * Math.sin(t * 0.08 + c.ph);
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const cg0 = ctx.createRadialGradient(x, y, 0, x, y, c.r * 3);
        cg0.addColorStop(0, `rgba(255,${Math.round(110 + 70 * k)},50,${0.8 * k * glow})`); cg0.addColorStop(1, 'rgba(255,80,20,0)');
        ctx.fillStyle = cg0; ctx.beginPath(); ctx.arc(x, y, c.r * 3, 0, 6.283); ctx.fill();
        ctx.restore();
      }
    }

    // In front of the flames: just a soft glow where the fire meets the wood (nothing solid covers the flames)
    function frontLogs(glow) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const fr = baseW * 0.11;
      const g = ctx.createRadialGradient(fx, fy + fr * 0.6, 0, fx, fy + fr * 0.6, baseW * 0.4);
      g.addColorStop(0, `rgba(255,150,60,${0.25 * glow})`); g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(fx, fy + fr * 0.6, baseW * 0.4, fr * 1.2, 0, 0, 6.283); ctx.fill();
      ctx.restore();
      // one log lying along the front of the pit, below the flames (the fire sits on it)
      const x0 = fx - baseW * 0.4, y0 = fy + fr * 0.95, x1 = fx + baseW * 0.36, y1 = fy + fr * 1.2, th = 20 * S;
      log(x0, y0, x1, y1, th, '#2e1a11');
      const cg = ctx.createLinearGradient(0, y0 - th / 2, 0, y0 + th / 2);            // top edge glowing where the flames touch
      cg.addColorStop(0, `rgba(255,140,50,${0.75 * glow})`); cg.addColorStop(0.45, 'rgba(120,40,15,0.25)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.strokeStyle = cg; ctx.lineWidth = th; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.fillStyle = '#7d5638'; ctx.beginPath(); ctx.ellipse(x1 + th * 0.2, y1, th * 0.3, th * 0.5, 0, 0, 6.283); ctx.fill();
      ctx.strokeStyle = '#4e331f'; ctx.lineWidth = Math.max(1, S);
      ctx.beginPath(); ctx.ellipse(x1 + th * 0.2, y1, th * 0.15, th * 0.25, 0, 0, 6.283); ctx.stroke();
    }

    const sparks = [], embers = [];
    function spawn() {
      // a few soft glints inside the flames + embers drifting up into the night
      for (let i = 0; i < 3; i++) {
        const u = (Math.random() + Math.random()) / 2 - 0.5;
        sparks.push({ x: fx + u * baseW * 0.7, y: fy - rand(0, 0.2) * flameH, vy: -rand(2, 3.4) * (flameH / 330), life: 40, max: 40, size: baseW * rand(0.08, 0.16) });
      }
      if (Math.random() < 0.3) embers.push({ x: fx + rand(-0.25, 0.25) * baseW, y: fy - flameH * rand(0.5, 0.8), vx: rand(-0.6, 0.6), vy: -rand(0.8, 2), life: rand(80, 170), r: rand(1, 2.2) });
    }

    // One flame tongue: a teardrop that sways and stretches
    function tongue(x, base, w, h, sway) {
      ctx.beginPath();
      ctx.moveTo(x - w, base);
      ctx.bezierCurveTo(x - w * 1.15, base - h * 0.42, x + sway * 0.4 - w * 0.4, base - h * 0.72, x + sway, base - h);
      ctx.bezierCurveTo(x + sway * 0.4 + w * 0.4, base - h * 0.72, x + w * 1.15, base - h * 0.42, x + w, base);
      ctx.bezierCurveTo(x + w, base + w * 0.4, x - w, base + w * 0.4, x - w, base); // rounded bottom
      ctx.closePath(); ctx.fill();
    }

    const LAYERS = [['#b92f17', 1, 1], ['#e8561c', 0.84, 0.88], ['#ff8f2a', 0.68, 0.76], ['#ffc24a', 0.52, 0.64], ['#ffe79a', 0.38, 0.52], ['#fff8e4', 0.24, 0.4]];
    function drawFire(glow) {
      // big soft glow around the fire
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(fx, fy - flameH * 0.4); ctx.scale(1, 0.85);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, flameH * 1.2);
      g.addColorStop(0, `rgba(255,140,50,${0.4 * glow})`); g.addColorStop(1, 'rgba(255,90,30,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, flameH * 1.2, 0, 6.283); ctx.fill();
      ctx.restore();

      // Tongues start along the front arc of the fire bed, so the bottom is rounded, not flat
      const fr = baseW * 0.11;
      const baseOf = (u) => fy - fr * 0.45 + fr * 0.7 * Math.sqrt(Math.max(0, 1 - (2 * u) ** 2));
      const catchUp = reduceMotion ? 1 : Math.min(1, t / 90) ** 0.6; // flames grow as the fire catches
      const now = tongues.map((tg) => ({
        base: baseOf(tg.u),
        x: fx + tg.u * baseW * 0.82,
        w: tg.w,
        h: catchUp * tg.h * (reduceMotion ? 1 : 0.84 + 0.12 * Math.sin(t * 0.09 + tg.ph) + 0.07 * Math.sin(t * 0.23 + tg.ph * 2) + Math.random() * 0.03),
        sway: reduceMotion ? 0 : Math.sin(t * 0.055 + tg.ph) * tg.w * 0.7,
      }));
      for (const [color, wm, hm] of LAYERS) {
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.ellipse(fx, fy - fr * 0.2, baseW * 0.42 * wm, fr * (0.6 + 0.2 * wm), 0, 0, 6.283); ctx.fill();
        for (const f of now) tongue(f.x + f.sway * (1 - wm) * 0.3, f.base - (1 - wm) * fr * 0.4, f.w * wm, f.h * hm, f.sway * hm);
      }

      // White-hot heart behind the card so the lettering stays readable (elliptical, soft edge)
      const cy = fy - flameH * 0.4, rx = Math.max(baseW * 0.62, 200), ryc = Math.max(flameH * 0.42, 150);
      ctx.save();
      ctx.translate(fx, cy); ctx.scale(1, ryc / rx);
      const core = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      core.addColorStop(0, `rgba(255,250,234,${0.92 * glow})`);
      core.addColorStop(0.55, `rgba(255,236,190,${0.7 * glow})`);
      core.addColorStop(0.8, `rgba(255,200,120,${0.22 * glow})`);
      core.addColorStop(1, 'rgba(255,170,80,0)');
      ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0, 0, rx, 0, 6.283); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = sparks.length - 1; i >= 0; i--) {
        const f = sparks[i];
        f.y += f.vy; f.x += (fx - f.x) * 0.02 + Math.sin((t + i) * 0.2) * 0.3; f.life--;
        if (f.life <= 0) { sparks.splice(i, 1); continue; }
        const k = f.life / f.max;
        ctx.globalAlpha = k * 0.35;
        const sz = f.size * (0.4 + k * 0.6);
        ctx.drawImage(FLAME[k > 0.5 ? 1 : 2], f.x - sz / 2, f.y - sz / 2, sz, sz);
      }
      for (let i = embers.length - 1; i >= 0; i--) {
        const e = embers[i];
        e.x += e.vx + Math.sin((t + i * 13) * 0.05) * 0.4; e.y += e.vy; e.life--;
        if (e.life <= 0 || e.y < 0) { embers.splice(i, 1); continue; }
        ctx.globalAlpha = Math.min(1, e.life / 50);
        const sz = e.r * 6;
        ctx.drawImage(EMBER, e.x - sz / 2, e.y - sz / 2, sz, sz);
      }
      ctx.restore();
    }

    // ---------- You (first person): sneakers + your roasting stick ----------
    function you(off, toast) {
      const s = S * 0.6;
      for (const side of [-1, 1]) {
        const x = W / 2 + side * (100 * s + 24) + off, y = H + 85 * s;
        ctx.save(); ctx.translate(x, y); ctx.rotate(side * 0.14);
        ctx.fillStyle = '#0e1018';                                                       // jeans
        ctx.beginPath(); ctx.roundRect(-40 * s, -40 * s, 80 * s, 140 * s, 28 * s); ctx.fill();
        ctx.fillStyle = '#4a4540';                                                       // sole
        ctx.beginPath(); ctx.ellipse(0, -95 * s, 44 * s, 76 * s, 0, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#23242c';                                                       // upper
        ctx.beginPath(); ctx.ellipse(0, -90 * s, 37 * s, 64 * s, 0, 0, 6.283); ctx.fill();
        ctx.fillStyle = 'rgba(200,190,175,0.25)';                                        // laces
        for (let k = 0; k < 4; k++) ctx.fillRect(-13 * s, (-100 + k * 13) * s, 26 * s, 3 * s);
        const lg = ctx.createLinearGradient(0, -170 * s, 0, -90 * s);                    // firelight on the toe
        lg.addColorStop(0, 'rgba(255,160,90,0.3)'); lg.addColorStop(1, 'rgba(255,160,90,0)');
        ctx.fillStyle = lg; ctx.beginPath(); ctx.ellipse(0, -95 * s, 44 * s, 76 * s, 0, 0, 6.283); ctx.fill();
        ctx.restore();
      }
      // Your hand, low in the corner, holding a thin stick into the flames
      const hx = Math.min(W - 30 * s, fx + baseW * 0.85) + off * 1.2, hy = H - 18 * s;
      const tip = { x: fx + baseW * (W < 640 ? 0.5 : 0.56) + off * 0.6, y: fy - flameH * (W < 640 ? 0.1 : 0.2) }; // at the edge of the flames, not in the white-hot middle
      roastingStick(hx, hy, tip.x, tip.y, Math.max(3.5, 7 * s), 13 * s, toast);
      ctx.fillStyle = '#10141f';                                                          // sleeve
      ctx.beginPath(); ctx.moveTo(hx + 10 * s, H + 10); ctx.lineTo(hx + 4 * s, hy + 6 * s); ctx.lineTo(hx + 34 * s, hy - 4 * s); ctx.lineTo(hx + 60 * s, H + 10); ctx.fill();
      ctx.fillStyle = '#6e4a38';                                                          // hand, in shadow
      ctx.beginPath(); ctx.ellipse(hx, hy, 20 * s, 15 * s, -0.6, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,160,100,0.25)';
      ctx.beginPath(); ctx.ellipse(hx - 5 * s, hy - 5 * s, 12 * s, 7 * s, -0.6, 0, 6.283); ctx.fill();
      // darken the very bottom of the frame so the foreground recedes
      const fade = ctx.createLinearGradient(0, H * 0.82, 0, H);
      fade.addColorStop(0, 'rgba(7,6,12,0)'); fade.addColorStop(1, 'rgba(7,6,12,0.7)');
      ctx.fillStyle = fade; ctx.fillRect(0, H * 0.82, W, H * 0.18);
    }

    // ---------- Loop ----------
    function frame() {
      t++;
      look += (lookTarget - look) * 0.05;
      const glow = reduceMotion ? 1 : 0.86 + Math.sin(t * 0.11) * 0.06 + Math.sin(t * 0.37) * 0.04 + Math.random() * 0.04;
      const toast = Math.min(0.9, 0.15 + (t % 1800) / 1800);

      ctx.clearRect(0, 0, W, H);
      sky(-look * 12);
      ground(glow);

      ctx.save(); ctx.translate(-look * 22, 0);
      const narrow = W < 640;
      const pS = S * (narrow ? 0.9 : 1.2);
      const ry = baseW * 0.19;
      // friends across the fire (behind it), drawn first so the flames overlap them
      const side = Math.min(baseW * 1.05, W * 0.36);
      person(fx - side, fy - ry * 1.7, pS, { top: '#2b2224', pants: '#181318', shoes: '#231c1d', skin: '#3a2a26', hood: true, hair: 'long', hairColor: '#150f10',
        stick: { x: fx - Math.min(baseW * 0.64, side * 0.55), y: fy - flameH * 0.32 }, dir: 1, toast: 0.5 });
      person(fx + baseW * 0.58, fy - ry * 2.3, pS * 0.85, { top: '#2e2021', pants: '#171216', shoes: '#141012', skin: '#382824', beanie: '#241a1b', mug: '#3a3030' });
      person(fx + side, fy - ry * 1.5, pS, { top: '#221e26', pants: '#151218', shoes: '#1d1719', skin: '#33241f', hair: 'curly', hairColor: '#120d0e', guitar: true });
      ctx.restore();

      ctx.save(); ctx.translate(-look * 26, 0);
      card.style.transform = `translate(calc(-50% + ${(-look * 26).toFixed(1)}px), -50%)`;
      stones(false);
      logs(glow);
      spawn();
      drawFire(glow);
      frontLogs(glow);
      stones(true);
      ctx.restore();

      you(-look * 40, toast);
      if (!reduceMotion) requestAnimationFrame(frame);
    }

    addEventListener('resize', resize);
    // Turn your head a little with the mouse (or by tilting the phone)
    addEventListener('pointermove', (e) => { lookTarget = (e.clientX / W - 0.5) * 2; });
    addEventListener('deviceorientation', (e) => { if (e.gamma != null) lookTarget = Math.max(-1, Math.min(1, e.gamma / 30)); });

    resize();
    // Warm the fire up so it's already burning on the first frame
    for (let i = 0; i < 40; i++) spawn();
    frame();
  })();
  </script>
</body>
</html>
