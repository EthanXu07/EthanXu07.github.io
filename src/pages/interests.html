    <!-- ============ WORLD 4: SIDE QUESTS (hub) ============ -->

    <section id="interests" class="world" data-checkpoint="Side quests">
      <header class="world-head">
        <p class="world-num">WORLD 5</p>
        <h1 class="world-title">Side quests</h1>
      </header>
      <p class="section-lede">What I'm up to when I'm not coding. Every one of these is still in progress.</p>

{{cards}}
      </ol>
