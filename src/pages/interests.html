    <!-- ============ WORLD 5: THE LIBRARY (hub) ============ -->
    <!-- Book spines and catalog cards are generated from src/interests.json -->
    <section id="interests" class="world" data-checkpoint="Library">
      <header class="world-head">
        <p class="world-num">WORLD 5</p>
        <h1 class="world-title">The library</h1>
      </header>
      <p class="section-lede">What I'm up to when I'm not coding. Every interest is a book I'm still writing. Pull one off the shelf.</p>

      <div class="filter" role="group" aria-label="Browse the library by section">
        <button class="chip is-on" data-filter="all" aria-pressed="true">All sections</button>
{{chips}}
      </div>

      <div class="bookcase">
        <ul class="books" aria-label="Bookshelf">
{{spines}}
          <li class="bookend" aria-hidden="true"></li>
          <!-- shelf props: decorative, hidden on narrow screens -->
          <li class="shelf-prop prop-stack" aria-hidden="true"><span></span><span></span><span></span></li>
          <li class="shelf-prop prop-plant" aria-hidden="true">
            <svg viewBox="0 0 16 22" width="64" height="88" shape-rendering="crispEdges">
              <path fill="#3f6b33" d="M7 1h2v2H7zM4 3h2v2H4zM10 3h2v2h-2zM2 6h3v2H2zM11 6h3v2h-3zM6 3h4v9H6zM3 5h3v3H3zM10 5h3v3h-3zM1 8h4v2H1zM11 8h4v2h-4z"/>
              <path fill="#7aa35a" d="M7 2h1v8H7zM4 4h1v1H4zM11 4h1v1h-1zM2 7h2v1H2zM12 7h2v1h-2zM5 6h1v1H5zM10 6h1v1h-1z"/>
              <path fill="#2e4d26" d="M9 4h1v7H9zM12 9h2v1h-2zM2 9h2v1H2z"/>
              <path fill="#b0603c" d="M3 12h10v2H3zM4 14h8v8H4z"/>
              <path fill="#d4835a" d="M3 12h10v1H3zM5 14h1v7H5z"/>
              <path fill="#7a3d22" d="M11 14h1v8h-1zM4 21h8v1H4z"/>
            </svg>
          </li>
        </ul>
      </div>

      <!-- Reading desk: a picked book opens here; one per interest, hidden until its spine is clicked -->
      <div class="reading-desk">
        <!-- Desk scene, shown while every book is on the shelf -->
        <div class="desk-empty" id="shelfHint">
          <svg class="desk-prop desk-lamp" viewBox="0 0 16 20" width="64" height="80" shape-rendering="crispEdges" aria-hidden="true">
            <path fill="#2a1f1a" d="M3 18h10v2H3zM7 8h2v10H7z"/>
            <path fill="#5f9c8f" d="M4 1h8v1H4zM3 2h10v4H3zM2 6h12v2H2z"/>
            <path fill="#8fbfb2" d="M4 2h2v4H4z"/>
            <path fill="#f3c969" d="M5 8h6v1H5z"/>
            <path fill="#4a463e" d="M4 18h8v1H4z"/>
          </svg>
          <div class="desk-prop desk-returns" aria-hidden="true"><span></span><span></span><span></span><b>Returns</b></div>
          <svg class="desk-prop desk-stamp" viewBox="0 0 16 15" width="48" height="45" shape-rendering="crispEdges" aria-hidden="true">
            <path fill="#8a5a3c" d="M6 1h4v2H6zM7 3h2v5H7z"/>
            <path fill="#a8714a" d="M6 1h1v2H6z"/>
            <path fill="#2a1f1a" d="M4 8h8v3H4z"/>
            <path fill="#9c3423" d="M1 12h14v3H1z"/>
            <path fill="#d4553a" d="M2 12h12v1H2z"/>
          </svg>
          <p class="desk-hint">Pick a book off the shelf to read it here.</p>
          <svg class="desk-prop desk-laptop" viewBox="0 0 32 21" width="112" height="74" shape-rendering="crispEdges" aria-hidden="true">
            <path fill="#c9ccd1" d="M3 0h26v18H3z"/>
            <path fill="#1b1d22" d="M4 1h24v16H4z"/>
            <path fill="#22303d" d="M5 2h22v14H5z"/>
            <path fill="#1b1d22" d="M14 1h4v2h-4z"/>
            <path fill="#f3c969" d="M6 4h5v1H6zM8 10h4v1H8z"/>
            <path fill="#8fbfb2" d="M12 4h7v1h-7zM8 6h9v1H8zM13 10h6v1h-6z"/>
            <path fill="#d4553a" d="M8 8h3v1H8zM6 12h3v1H6z"/>
            <path fill="#8fb8c9" d="M12 8h10v1H12zM18 6h4v1h-4z"/>
            <path class="cursor" fill="#f1e6cc" d="M10 12h1v2h-1z"/>
            <path fill="#6c7179" d="M3 17h26v1H3z"/>
            <path fill="#dfe2e6" d="M0 18h32v2H0z"/>
            <path fill="#b5b9bf" d="M13 18h6v1h-6z"/>
            <path fill="#8e939a" d="M1 20h30v1H1z"/>
          </svg>
          <svg class="desk-prop desk-mug" viewBox="0 0 16 17" width="56" height="60" shape-rendering="crispEdges" aria-hidden="true">
            <g class="steam" fill="#b9b39c"><path d="M5 0h1v2H5zM4 2h1v2H4zM9 1h1v2H9zM10 3h1v2h-1z"/></g>
            <path fill="#f1e6cc" d="M2 6h9v10H2zM3 16h7v1H3z"/>
            <path fill="#cbbd9c" d="M9 6h2v10H9z"/>
            <path fill="#d4553a" d="M2 9h9v2H2z"/>
            <path fill="#f1e6cc" d="M11 8h3v1h-3zM13 9h1v4h-1zM11 13h3v1h-3z"/>
            <path fill="#5e3a22" d="M3 6h7v1H3z"/>
          </svg>
          <svg class="desk-prop desk-banker" viewBox="0 0 18 16" width="64" height="57" shape-rendering="crispEdges" aria-hidden="true">
            <path fill="#1f5236" d="M4 1h10v1H4zM3 2h12v4H3z"/>
            <path fill="#2f7a4a" d="M4 2h10v3H4z"/>
            <path fill="#5fae78" d="M5 2h5v1H5z"/>
            <path fill="#c9962a" d="M2 6h14v1H2z"/>
            <path fill="#f3c969" d="M4 7h10v1H4z"/>
            <path fill="#c9962a" d="M8 8h2v5H8zM13 7h1v2h-1z"/>
            <path fill="#9a6f1a" d="M9 8h1v5H9zM12 9h3v1h-3z"/>
            <path fill="#c9962a" d="M4 13h10v1H4z"/>
            <path fill="#9a6f1a" d="M3 14h12v2H3z"/>
            <path fill="#f3c969" d="M4 14h6v1H4z"/>
          </svg>
          <aside class="on-hold" aria-labelledby="onHoldTitle">
            <p class="on-hold-title" id="onHoldTitle">On hold</p>
            <ul>
{{onHold}}
            </ul>
            <p class="on-hold-foot">{{onHoldCount}} volumes waiting to be written</p>
          </aside>
        </div>
{{cards}}
        <div class="desk-top">
          <p class="desk-plaque">{{stats}}</p>
        </div>
        <div class="desk-legs" aria-hidden="true"><span></span><span></span></div>
      </div>
    </section>
