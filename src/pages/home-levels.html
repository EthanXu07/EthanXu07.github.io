    <!-- ============ OVERVIEW ============ -->
    <!-- Cards are filled in by tools/build.mjs from src/data/*.json and src/interests.json -->
    <section id="levels" class="world" data-checkpoint="Overview">
      <header class="world-head">
        <p class="world-num">OVERVIEW</p>
        <h2 class="world-title">Explore my work</h2>
      </header>
      <ul class="overview">
{{exploreCards}}
      </ul>
    </section>

    <!-- ============ GUEST WALL ============ -->
    <!-- Shared r/place-style pixel canvas (guest-wall.js, tools/guest-wall.sql) -->
    <section id="guest" class="world" data-checkpoint="Guest wall">
        <section class="guest-wall" id="guestWall" aria-labelledby="guestWallTitle">
          <div class="guest-head">
            <h2 class="guest-plaque" id="guestWallTitle">Guest wall</h2>
            <p class="guest-lede">Leave your mark. Pick a colour and paint: click, or drag to draw. Everyone shares this wall, and what you paint stays until someone paints over it.</p>
          </div>
          <div class="guest-scroll">
            <canvas class="guest-canvas" tabindex="0" role="img" aria-label="Shared pixel wall, 160 by 60 squares. Use the arrow keys to move, Enter to paint, Shift and arrows to paint a line."></canvas>
          </div>
          <div class="guest-bar">
            <div class="guest-palette" role="group" aria-label="Colour"></div>
            <div class="guest-tools">
              <div class="guest-seg" role="group" aria-label="Brush size">
                <button type="button" data-brush="1" aria-label="Brush size 1"><i style="--s:2px"></i></button>
                <button type="button" data-brush="2" aria-label="Brush size 2"><i style="--s:5px"></i></button>
                <button type="button" data-brush="4" aria-label="Brush size 4"><i style="--s:9px"></i></button>
              </div>
              <div class="guest-seg guest-modes" role="group" aria-label="Touch mode">
                <button type="button" data-mode="paint" aria-pressed="true">Paint</button>
                <button type="button" data-mode="move" aria-pressed="false">Move</button>
              </div>
            </div>
            <p class="guest-status" role="status" aria-live="polite"></p>
            <p class="guest-coords" aria-hidden="true"></p>
          </div>
        </section>
    </section>
