    <!-- ============ VOLUME (generated per interest from src/interests.json) ============ -->
    <article class="world interest-page" data-checkpoint="{{title}}">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/interests/">Library</a> <span aria-hidden="true">›</span> <span>{{type}}</span> <span aria-hidden="true">›</span> <span aria-current="page">{{title}}</span></nav>

      <header class="interest-hero">
        <div class="book-cover" style="--c: {{spine}}">
          <img class="book-cover-photo" src="{{photo}}" alt="{{title}}" width="400" height="300">
          <p class="book-cover-title">{{title}}</p>
        </div>
        <div>
          <p class="world-num">VOLUME {{num}} / {{total}}</p>
          <h1 class="world-title">{{title}}</h1>
          <p class="interest-lede">{{tagline}}</p>
          <p class="call-chip">Call no. {{call}} <span aria-hidden="true">·</span> {{type}} section</p>
        </div>
      </header>

      <section class="toc-page" aria-labelledby="toc-title">
        <h2 class="toc-title" id="toc-title">Contents</h2>
        <ol class="toc">
{{toc}}
        </ol>
        <p class="toc-subjects"><span>Subjects</span> {{rewards}}</p>
        <p class="toc-folio" aria-hidden="true">— i —</p>
      </section>

      <div class="interest-sections">
{{sections}}
      </div>

      <h2 class="mini-head">Illustrations</h2>
      <div class="gallery">
{{gallery}}
      </div>

      <nav class="interest-pager" aria-label="More volumes">
        <a class="btn btn-ghost" href="{{prevHref}}">◀ {{prevTitle}}</a>
        <a class="btn btn-paper" href="/interests/">Back to the shelf</a>
        <a class="btn btn-ghost" href="{{nextHref}}">{{nextTitle}} ▶</a>
      </nav>
    </article>
