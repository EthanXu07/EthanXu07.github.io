    <!-- ============ SKILL TREE ============ -->
    <!-- Generated from src/data/skills.json + the "skills" tags in experience.json / projects.json -->
    <section id="skills" class="world" data-checkpoint="Skill tree">
      <header class="world-head">
        <p class="world-num">WORLD 4</p>
        <h1 class="world-title">Skill tree</h1>
      </header>
      <p class="section-lede">Every skill here was earned on a real quest. Level = how many quests and projects used it. Pick a skill to see where.</p>

      <div class="skill-layout">
        <div class="skill-tree">
{{branches}}
        </div>
        <aside class="skill-panel px-box paper" id="skillPanel" aria-live="polite">
          <p class="objectives-label">Skill details</p>
          <h2 id="skillName">Pick a skill</h2>
          <p class="skill-level" id="skillLevel"></p>
          <p class="quest-org" id="skillHint">Select any node on the tree to see which quests and projects used it.</p>
          <ul class="quest-list skill-used" id="skillUsed"></ul>
        </aside>
      </div>
      <script type="application/json" id="skillData">{{skillData}}</script>
    </section>
