    <!-- ============ WORLD 2: QUEST LOG (experience) ============ -->
    <!-- Entries come from src/data/experience.json -->
    <section id="quests" class="world" data-checkpoint="Quest log">
      <header class="world-head">
        <p class="world-num">WORLD 2</p>
        <h1 class="world-title">Quest log</h1>
      </header>

      <div class="filter" role="group" aria-label="Filter quests">
        <button class="chip is-on" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" data-filter="active" aria-pressed="false">Active</button>
        <button class="chip" data-filter="done" aria-pressed="false">Completed</button>
      </div>

      <ol class="quests">
{{quests}}
      </ol>
    </section>
