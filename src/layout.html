<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="https://ethanxu.dev{{path}}">
  <meta property="og:url" content="https://ethanxu.dev{{path}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta name="theme-color" content="#1c2a25">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/site-config.js"></script>
</head>
<body data-page="{{page}}">
  <!-- Generated by tools/build.mjs from src/. Edit the files in src/, then run: node tools/build.mjs -->
  <a class="skip" href="#content">Skip to content</a>

  <!-- ============ HUD (always-visible nav) ============ -->
  <header class="hud" id="hud">
    <div class="hud-row">
      <a class="hud-logo" href="/" aria-label="Home">
        <span class="hearts" aria-hidden="true">♥♥♥</span>
        <span class="hud-name">ETHAN XU</span>
      </a>
      <nav class="hud-nav" aria-label="Pages">
{{nav}}
      </nav>
      <a class="btn btn-gold hud-resume" data-link="resume" href="/resume/">Resume <span class="tri" aria-hidden="true"></span></a>
    </div>
    <div class="xp" aria-hidden="true"><span class="xp-label">XP</span><div class="xp-track"><div class="xp-fill" id="xpFill"></div></div></div>
  </header>

  <!-- Level map: a checkpoint flag per section; the sprite walks down as you scroll (wide screens only) -->
  <aside class="track" aria-hidden="true">
    <div class="track-line"></div>
    <canvas class="track-hero" id="trackHero" width="12" height="16"></canvas>
  </aside>

  <main id="content" class="{{mainClass}}">
{{content}}
  </main>

{{contact}}
  <footer class="credits">
    <p class="thanks">Thanks for playing</p>
    <p class="footer-links"><a href="/play/">Bonus level</a></p>
    <p>© <span id="year">2026</span> Ethan Xu · Built by hand in Berkeley, CA</p>
    <a href="#hud" class="btn btn-sm btn-ghost">▲ Back to top</a>
  </footer>

{{resumeModal}}
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/resume-viewer.js"></script>
  <script src="/script.js"></script>
{{scripts}}
</body>
</html>
